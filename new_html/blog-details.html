<!DOCTYPE html>
<html lang="en" data-base="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Anupam Stores</title>
    <meta name="description" content="Read guides and store stories from Anupam Stores, Jaipur.">
    <link rel="icon" href="assets/images/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/collection.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/blog-details.css">
</head>
<body class="blog-page blog-article-page">
    <div data-component="header"></div>
    <div data-component="mobile-drawer"></div>

    <main>
        <article class="blog-article" aria-labelledby="article-title">
            <div class="container">
                <nav class="collection-crumb blog-crumb" aria-label="Breadcrumb" data-article-crumb></nav>
                <div class="article-hero" data-article-hero></div>
                <header class="article-header">
                    <h1 class="article-title" id="article-title"></h1>
                    <p class="article-meta" data-article-meta></p>
                </header>
                <div class="article-body article-content" data-article-body></div>
            </div>
        </article>

        <section class="section blog-recent" id="recent-articles" aria-labelledby="recent-articles-title">
            <div class="container">
                <div class="section-head">
                    <h2 class="section-title" id="recent-articles-title">Recent Articles</h2>
                    <div class="section-controls">
                        <button class="slider-btn prev" type="button" data-recent-prev aria-label="Previous recent articles">
                            <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
                        </button>
                        <button class="slider-btn next" type="button" data-recent-next aria-label="Next recent articles">
                            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
                        </button>
                    </div>
                </div>
                <div class="slider-wrapper" data-recent-slider>
                    <div class="slider-track blog-recent-track" data-slider-track data-recent-track></div>
                </div>
            </div>
        </section>

        <div data-component="newsletter"></div>
    </main>

    <div data-component="follow-rail"></div>
    <div data-component="footer"></div>
    <div data-component="quickview"></div>

    <script src="js/shared.js"></script>
    <script src="js/blogs-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/blog-details.js"></script>
</body>
</html>
